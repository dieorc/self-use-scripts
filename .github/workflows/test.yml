name: Validate Snell quota scripts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Calendar, controller and notification tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: for script in bootstrap.sh install.sh oneclick.sh manage.sh psm-snell tests/systemd_smoke.sh; do bash -n "$script"; done
  netfilter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2 python3
      - name: Real TCP UDP IPv4 IPv6 quota isolation
        run: sudo unshare --net python3 tests/linux_netfilter.py
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare complete source archive
        run: git archive --format=zip --prefix=self-use-scripts-ci/ -o "$RUNNER_TEMP/psmq-source.zip" HEAD
      - name: Standalone bootstrap with official Snell V5 and systemd
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env PSMQ_TEST_ARCHIVE="$RUNNER_TEMP/psmq-source.zip" bash tests/systemd_smoke.sh
